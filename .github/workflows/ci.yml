name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Layout guards (every page root must declare a container-query context)
        run: node scripts/check-layout-guards.mjs

      - name: Portal/container isolation guard (portal-rendered overlays must never be styled inside @container)
        run: python3 scripts/check-portal-container-isolation.py

      - name: Theme contrast guard (WCAG AA in light + dark)
        run: node scripts/check-theme-contrast.mjs

      - name: Icon scale guard (icon sizes must stay on the documented ladder)
        run: node scripts/check-icon-scale.mjs

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
